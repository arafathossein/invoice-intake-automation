# Invoice service + n8n on one private network.
#   docker compose up -d
#   n8n editor: http://localhost:5678   ·   service: http://localhost:8000/docs
services:
  invoice-service:
    build: .
    env_file: .env
    volumes:
      - invoice-data:/app/data
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    environment:
      - GENERIC_TIMEZONE=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - invoice-service
    restart: unless-stopped

volumes:
  invoice-data:
  n8n-data:
